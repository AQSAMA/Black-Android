plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.racas.black.preview"
    compileSdk 34

    defaultConfig {
        applicationId "com.racas.black.preview"
        minSdk 29
        targetSdk 34
        versionCode project.hasProperty("versionCode") ? project.versionCode.toInteger() : 1
        versionName project.hasProperty("versionName") ? project.versionName : "2.1-preview"
    }

    // the preview is installable beside the game; a release key if the workflow has one, a debug signature otherwise.
    // Tagged releases set BLACK_REQUIRE_SIGNING: an unsigned release would get a different runner key every time and
    // could not update an installed preview, so the build fails instead.
    def requireSigning = System.getenv("BLACK_REQUIRE_SIGNING") == "true"
    def keystorePath = System.getenv("BLACK_KEYSTORE")
    def storePass = System.getenv("BLACK_KEYSTORE_PASSWORD")
    def alias = System.getenv("BLACK_KEY_ALIAS")
    def aliasPassword = System.getenv("BLACK_KEY_PASSWORD")
    if (requireSigning && !(keystorePath && storePass && alias && aliasPassword)) {
        throw new GradleException(
            "BLACK_REQUIRE_SIGNING is set but BLACK_KEYSTORE, BLACK_KEYSTORE_PASSWORD, BLACK_KEY_ALIAS and " +
                "BLACK_KEY_PASSWORD are not all present",
        )
    }
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword storePass
                keyAlias alias
                keyPassword aliasPassword
            }
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    implementation project(":ui")
    implementation platform("androidx.compose:compose-bom:2024.09.03")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
