# Builds the installable Control Center preview APK. It is a separate package (com.racas.black.preview), needs no game
# data and can be installed beside the full app.
#
# Secrets for a signed preview: PREVIEW_KEYSTORE_BASE64, PREVIEW_KEYSTORE_PASSWORD, PREVIEW_KEY_ALIAS,
# PREVIEW_KEY_PASSWORD. They are required for tagged releases; a manual run without them gets a debug-signed artifact.
name: UI Preview

on:
  workflow_dispatch:
  push:
    tags: ["preview-v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == preview-v* ]]; then
            name="${GITHUB_REF_NAME#preview-v}"
          else
            name="2.1-preview-${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "GRADLE_ARGS=-PversionCode=${{ github.run_number }} -PversionName=$name" >> "$GITHUB_ENV"

      - name: Preview key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PREVIEW_KEY_PASSWORD }}
          TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/preview-v') }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ "$TAG_RELEASE" = "true" ]; then
              echo "::error::Tagged preview releases require all four PREVIEW_* signing secrets."
              exit 1
            fi
            echo "::warning::No preview keystore: the APK has a debug signature"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/preview.jks"
          {
            echo "BLACK_KEYSTORE=$RUNNER_TEMP/preview.jks"
            echo "BLACK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BLACK_KEY_ALIAS=$KEY_ALIAS"
            echo "BLACK_KEY_PASSWORD=$KEY_PASSWORD"
            echo "BLACK_REQUIRE_SIGNING=true"
          } >> "$GITHUB_ENV"

      - name: Build
        run: bash ./gradlew -PpreviewOnly :uipreview:assembleRelease $GRADLE_ARGS

      - name: Name the APK
        shell: bash
        run: mv uipreview/build/outputs/apk/release/uipreview-release.apk "Black-Control-Center-${{ steps.version.outputs.name }}.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            "Black-Control-Center-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: Black-Control-Center-${{ steps.version.outputs.name }}
          path: Black-Control-Center-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/preview-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Black Control Center Preview ${{ github.ref_name }}
          body: |
            Installable preview of the Compose Material 3 Control Center.

            This APK is the interface only: it runs against demo settings and does not include the game. Install it
            beside the full app; its package is `com.racas.black.preview`.
          files: Black-Control-Center-${{ steps.version.outputs.name }}.apk
          prerelease: true
          make_latest: false
