pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Black Android"
include ":ui", ":uipreview"
// The preview APK only needs the UI module. Keeping :app out of the graph lets it build on Linux without the NDK,
